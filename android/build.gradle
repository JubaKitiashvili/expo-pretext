plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pretext'
version = '1.2.0'

android {
  namespace "expo.modules.pretext"
  defaultConfig {
    versionCode 3
    versionName '1.2.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
